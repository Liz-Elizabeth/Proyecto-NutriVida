<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriVida-login</title>
    <link rel="stylesheet" href="css/styleindex.css">
    <link rel="stylesheet" href="css/styleRegistroLogin.css">
</head>

<body>

    <main>
        <section id="login">
            <div class="login-container">
                <div class="login-logo-wrapper">
                    <img src="assets/img/logo-nutrivida.png" alt="NutriVida Logo" class="login-logo">
                </div>
                <h1>Iniciar Sesión</h1>
                <form action="">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <button type="submit">Iniciar Sesión</button>
                </form>

                <!-- Enlace a Registro -->
                <p class="login-register-link">
                    ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                </p>
            </div>
        </section>
    </main>





    <footer class="footer">
        <div class="footer-container">
            <div class="footer-top">
                <!-- Columna 1: Marca y Descripción -->
                <div class="footer-brand-col">
                    <a href="index.html" class="footer-brand">
                        <img src="assets/img/logo-nutrivida.png" alt="NutriVida" class="brand-logo">
                    </a>
                    <p class="footer-description">
                        Clínica Nutricional enfocada en el bienestar integral y la salud preventiva.
                    </p>
                </div>

                <!-- Columna 2: Enlaces -->
                <div class="footer-links-col">
                    <h4 class="footer-title">Enlaces</h4>
                    <ul class="footer-nav">
                        <li><a href="#contacto" class="footer-link">Contacto</a></li>
                        <li><a href="#nosotros" class="footer-link">Sobre Nosotros</a></li>
                    </ul>
                </div>

                <!-- Columna 3: Legal -->
                <div class="footer-links-col">
                    <h4 class="footer-title">Legal</h4>
                    <ul class="footer-nav">
                        <li><a href="privacidad.html" class="footer-link">Aviso de Privacidad</a></li>
                        <li><a href="terminos.html" class="footer-link">Términos de Servicio</a></li>
                    </ul>
                </div>
            </div>

            <!-- Línea divisoria punteada -->
            <hr class="footer-divider">

            <!-- Columna Inferior: Copyright -->
            <div class="footer-bottom">
                <p class="footer-copyright">
                    &copy; 2026 NutriVida Clínica Nutricional. Todos los derechos reservados.
                </p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>


</body>

</html>
